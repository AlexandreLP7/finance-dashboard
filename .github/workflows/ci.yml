name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  init:
    name: 1-Init (toolchains + caches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install Maven if missing
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y maven
          fi

  backend-tests:
    name: 2a-Tests backend (JUnit + JaCoCo >= 60%)
    needs: init
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Maven if missing
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y maven
          fi
      - name: mvn verify (tests + couverture JaCoCo, seuil 60%)
        working-directory: backend
        run: mvn -B verify

  frontend-tests:
    name: 2b-Tests frontend (Vitest >= 60%)
    needs: init
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: npm install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Tests + couverture (seuils 60% dans vite.config.ts)
        working-directory: frontend
        run: npm run test:coverage

  lint:
    name: 3-ESLint
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: npm install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: ESLint
        working-directory: frontend
        run: npm run lint

  typecheck:
    name: 4-TypeScript check (vue-tsc --noEmit)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: npm install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: vue-tsc --noEmit
        working-directory: frontend
        run: npm run type-check
