name: CD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Docker exige des noms d'image en minuscules (github.repository contient "AlexandreLP7")
  BACKEND_IMAGE: ghcr.io/alexandrelp7/finance-dashboard/backend
  FRONTEND_IMAGE: ghcr.io/alexandrelp7/finance-dashboard/frontend
  DEPLOY_PATH: /opt/finance-dashboard

jobs:
  build:
    name: Build & push images (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploiement LXC (Proxmox)
    needs: build
    # Runner auto-heberge sur la LXC : aucun port entrant a ouvrir sur la box.
    runs-on: [self-hosted, finance-lxc]
    concurrency: deploy-lxc
    steps:
      - name: Login ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Mise a jour du depot (compose, docs)
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          git fetch --quiet origin
          git reset --quiet --hard ${{ github.sha }}
      - name: Pull + redemarrage
        working-directory: ${{ env.DEPLOY_PATH }}
        env:
          TAG: ${{ github.sha }}
        run: |
          docker compose pull db backend frontend
          docker compose up -d --remove-orphans
          docker image prune -f
      - name: Verification
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/ || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then echo "API OK ($code)"; exit 0; fi
            sleep 5
          done
          echo "API injoignable apres deploiement"; docker compose -f ${{ env.DEPLOY_PATH }}/docker-compose.yml logs --tail 50 backend; exit 1
      - name: Logout ghcr.io
        if: always()
        run: docker logout ghcr.io
