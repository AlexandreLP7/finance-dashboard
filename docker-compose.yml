services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-finance}
      POSTGRES_USER: ${DB_USER:-finance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis dans .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/alexandrelp7/finance-dashboard/backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-finance}
      DB_USER: ${DB_USER:-finance}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis dans .env}
      APP_USER: ${APP_USER:?APP_USER requis dans .env}
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD requis dans .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY requis dans .env (openssl rand -base64 32)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis dans .env (openssl rand -base64 48)}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-20}
      APP_TOTP_ISSUER: ${APP_TOTP_ISSUER:-Finance Dashboard}
      BANK_PSD2_BASE_URL: ${BANK_PSD2_BASE_URL:-}
      BANK_PSD2_CLIENT_ID: ${BANK_PSD2_CLIENT_ID:-}
      BANK_PSD2_CLIENT_SECRET: ${BANK_PSD2_CLIENT_SECRET:-}
      BANK_PSD2_REDIRECT_URI: ${BANK_PSD2_REDIRECT_URI:-http://localhost:5173/bank-callback}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/alexandrelp7/finance-dashboard/frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  dbdata:
