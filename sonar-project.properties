sonar.projectKey=finance-dashboard
sonar.projectName=finance-dashboard
sonar.sources=frontend/src,backend/src/main/java
sonar.tests=frontend/src,backend/src/test/java
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/*.spec.ts
# frontend/src est a la fois source et test : seuls les *.spec.ts sont indexes comme tests
sonar.test.inclusions=**/*.spec.ts,backend/src/test/java/**
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.java.binaries=backend/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
