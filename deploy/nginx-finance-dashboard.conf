# Site nginx pour l'hôte Proxmox (ou la LXC) — reverse proxy vers la LXC applicative.
# A installer dans /etc/nginx/sites-available/finance-dashboard.conf puis:
#   ln -s /etc/nginx/sites-available/finance-dashboard.conf /etc/nginx/sites-enabled/
#   sed -i 's/__DOMAIN__/mon-dashboard.duckdns.org/g; s/__LXC_IP__/192.168.1.50/g' /etc/nginx/sites-available/finance-dashboard.conf
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name __DOMAIN__;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    location / {
        proxy_pass http://__LXC_IP__:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
